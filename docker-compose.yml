services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: speedtest
      POSTGRES_USER: speedtest
      POSTGRES_PASSWORD: speedtest
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d

  speedtest:
    build: .
    restart: unless-stopped
    environment:
      SQLITE_PATH: /data/speedtest.db
    volumes:
      - sqlite_data:/data

  connectivity:
    build: .
    restart: unless-stopped
    environment:
      SQLITE_PATH: /data/speedtest.db
    volumes:
      - sqlite_data:/data
    command: ["python", "connectivity_monitor.py"]

  data_sync:
    build: .
    restart: unless-stopped
    environment:
      SQLITE_PATH: /data/speedtest.db
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: speedtest
      DB_USER: speedtest
      DB_PASSWORD: speedtest
    volumes:
      - sqlite_data:/data
    command: ["python", "data_sync.py"]

volumes:
  pgdata:
  sqlite_data:
