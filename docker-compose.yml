services:
  db:
    image: postgres:16
    restart: unless-stopped
    profiles: [local_db]
    environment:
      POSTGRES_DB: ${DB_NAME:-speedtest}
      POSTGRES_USER: ${DB_USER:-speedtest}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-speedtest}
    ports:
      # Published on all interfaces on purpose: other hosts sync to this
      # container when it acts as the central server. start.sh generates a
      # random password for it.
      - "5432:5432"
    volumes:
      # Bind mount (not a named volume) so the data survives image rebuilds,
      # `docker compose down -v`, and is easy to back up
      - ./database:/var/lib/postgresql/data
      # Only the schema dir — the postgres entrypoint executes any *.sh it
      # finds in initdb.d, so migrate.sh must not be visible here
      - ./db/schema:/docker-entrypoint-initdb.d
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build: ./speedtest
    restart: unless-stopped
    # init reaps the orphaned data_sync processes that speed_test.py
    # fires off; without it they accumulate as zombies.
    init: true
    environment:
      SQLITE_PATH: /data/speedtest.db
      HOST_HOSTNAME: ${HOST_HOSTNAME}
      HOST_HASH: ${HOST_HASH}
      TZ: ${TIMEZONE:-UTC}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_SSLMODE: ${DB_SSLMODE:-prefer}
    volumes:
      # Bind mount for the same reason as ./database: survives rebuilds and
      # `docker compose down -v`, and backs up as a plain file copy
      - ./data:/data
      - ./speedtest:/app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
